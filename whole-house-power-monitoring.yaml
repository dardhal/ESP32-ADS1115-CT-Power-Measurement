# 3. TELECOM/SENSORS + MVHR (ADS1115 0x48, A2_GND)
# 5 A / 1 V SCT-013 #2
# Includes telecom devices, living room TV and deco, DIY temp/RH sensors and (pending) MVHR
  - platform: ads1115
    multiplexer: 'A2_GND'
    gain: 2.048
    name: "Telecom MVHR Washing AC Current"
    ads1115_id: ads1115_bus_0x48
    update_interval: 24ms
    id: ac_a_telecom_ct_sensor
    state_class: measurement
