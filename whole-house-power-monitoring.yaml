    device_class: power
    unit_of_measurement: "W"
    id: lights_ac_power

  - platform: total_daily_energy
    name: "Lights Energy Consumed"
    power_id: lights_ac_power
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh


