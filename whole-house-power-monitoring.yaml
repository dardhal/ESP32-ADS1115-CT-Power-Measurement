#### NOTE : ESP32 ADC inputs are highly non-linear at the end of the range, ie. under 150 mV it reads zero
####        For CT clamps with 1 V output, it means currents of 15% the full range can't be measured : 
####        - 0.75 A AC or  170 W for  5 A clamp
####        - 1.50 A AC or  345 W for 10 A clamp
####        - 3.00 A AC or  690 W for 20 A clamp
####        - 4.50 A AC or 1035 W for 30 A clamp
####        https://github.com/espressif/esp-idf/issues/164
####        https://www.esp32.com/viewtopic.php?t=2881
#### Official docs are now clear regarding the attenuation parameter and the impossibility to measure voltages under 100 mV approximately :
####   https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-reference/peripherals/adc.html#adc-attenuation
####
#### In summary, ESP32 is inappropriate to measure voltage at the low end of the range (< 100 mV) and hence inadequate for this use case.
#### Alternative would be to use one or more external quality ADC circuits (ie. ADS1115 , 4 x 16 bit ADC through I2C, can use 4 boards at same time) instead
####    https://esphome.io/components/sensor/ads1115.html
#### Although a ESP8266 only has one (software) I2C whereas a ESP32 has two hardware I2C only (limiting amount of measured channels to eight)
####
#### When measured with the volt meter, we obtained the following values at the terminals of the CT clamps for known currents :
####                5 A CT Clamp    10A CT Clamp    15A CT Clamp    30A CT Clamp
#### 0.135 A AC :       0.0256 V        0.0130 V        0.0085 V        0.0042 V
#### 4.050 A AC :       0.8090 V        0.4060 V        0.2700 V        0.1350 V
#### 7.700 A AC :       1.5450 V        0.7750 V        0.5150 V        0.2580 V

#### 1. FRIDGE (GPIO32)
  - platform: adc
    pin: GPIO32
    name: "Fridge ADC Pin Voltage"
    accuracy_decimals: 3
    update_interval: 5s
    state_class: measurement
    device_class: voltage
    unit_of_measurement: "V"
    id: fridge_adc_sensor
    filters:
      - throttle: 15s

  #### CT Clamp integration from measured ADC values
  - platform: ct_clamp
    sensor: fridge_adc_sensor
    name: "Fridge AC Current"
    accuracy_decimals: 3
    sample_duration: 200ms
    update_interval: 10s
    state_class: measurement
    device_class: current
    unit_of_measurement: "A"
    id: fridge_ac_current
    filters:
      - calibrate_linear:
          # Measured ct_clamp A sensor measurement to real A current
          - 0.0750 -> 0.135
          - 0.2950 -> 4.070
          - 0.2950 -> 4.070
      - throttle: 30s

  #### Template to also publish calculated power measured (using 230 V)
  - platform: template
    name: "Fridge AC Power"
    lambda: |-
      if ( id(fridge_ac_current).state < 0 ) {
        return 0;
      } else {
        return (230 * id(fridge_ac_current).state);
      }
    accuracy_decimals: 3
    update_interval: 30s
    state_class: measurement
    device_class: power
    unit_of_measurement: "W"
    id: fridge_ac_power

  - platform: total_daily_energy
    name: "Fridge Energy Consumed"
    power_id: fridge_ac_power
    filters:
      - multiply: 0.001
    unit_of_measurement: kWh


#### 2. LIGHTING + WASHING MACHINE (GPIO33)
  - platform: adc
    pin: GPIO33
    name: "Lights ADC Pin Voltage"
    accuracy_decimals: 3
    update_interval: 1s
    state_class: measurement
    device_class: voltage
    unit_of_measurement: "V"
    id: lights_adc_sensor
    filters:
      - throttle: 60s

  #### CT Clamp integration from measured ADC values
  - platform: ct_clamp
    sensor: lights_adc_sensor
    name: "Lights AC Current"
    accuracy_decimals: 3
    sample_duration: 200ms
    update_interval: 5s
    state_class: measurement
    device_class: current
    unit_of_measurement: "A"
    id: lights_ac_current
    filters:
      - calibrate_linear:
          # Measured value for 0 A on wire (0.0011 from lights_adc_sensor)
          - 0.0011 -> 0.00
          # Measured value for 2.07 A on wire (0.072 from lights_adc_sensor)
          - 0.072 -> 2.07
      - throttle: 30s

  #### Template to also publish calculated power measured (using 230 V)
  - platform: template
    name: "Lights AC Power"
    lambda: |-
      if ( id(lights_ac_current).state < 0 ) {
        return 0;
      } else {
        return (230 * id(lights_ac_current).state);
      }
    accuracy_decimals: 3
    update_interval: 30s
