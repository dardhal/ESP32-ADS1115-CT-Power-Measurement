          send_every:  625                    #
      - lambda: return sqrt(x);               ####
      - multiply:  15.0                       # Mapping measured voltage from CT clamp to current in the primary circuit (for 15 A / 1 V CT clamp)

  - platform: template
    name: "Lighting Washing AC Power"
