#### ESP32 Hardware I2C bus
# There are two hardware I2C peripherals with identifiers 0 and 1. Any available output-capable pins can be used for SCL and SDA but the defaults are given below.
#     |  I2C(0)  |  I2C(1)
# ----+----------+--------
# scl |    18    |    25
# sda |    19    |    26

