# Hostname : esp32-02
# Friendly Name : power-monitoring
# Summary : Multi channel AC power monitoring for home electrical circuits
# Description : By using SCT-013 CT clamps with 1 V AC output and external ADS1115 ADC, 
#               measure per-circuit AC current for instantaneous and cumulative energy utilization
# Software Used : Latest ESPHome code with two 4-channel ADS1115 ADC 16-bit boards attached to separate I2C buses
#   https://esphome.io/devices/esp32.html
#   https://esphome.io/components/i2c.html
#   https://esphome.io/components/sensor/adc.html
#   https://esphome.io/components/sensor/ct_clamp.html
#
# This is the list of electrical circuits to be monitored (current and voltage are AC)
# 1. Frigorífico    :  5 A / 1 V SCT-013 #1
# 
# 2. Iluminación    : 15 A / 1 V SCT-013 #1
#    Lavadora       :
# 
# 3. Telecom.+Sensor: 5 A / 1 V SCT-013 #2
# 
# 4. Fuerza Seco    : 10 A / 1 V SCT-013 #1
# 
# 5. Fuerza Húmedos : 30 A / 1 V SCT-013 #1 (incl. Domótica)
# 
# 6. Inducción      : 30 A / 1 V SCT-013 #2
# 
# 7. Horno          : 10 A / 1 V SCT-013 #2
#
# 8. Lavavajillas  :   5 A / 1 V SCT-013 #3
#
# x. Bajo Cubierta :  5 A / 1 V SCT-013 (PENDING)
# x. Bajo Vivienda : 10 A / 1 V SCT-013 (PENDING)
#
#### Considering the ESP32 lack of linearity at low values would not be a problem for some circuits (oven / dishwasher), could be used to have more measured circuits
#### ADCs in the ESP32 also may or may not be adequate to measure an input from a ZMPT101B AC transformer and have a reliable AC voltage source running off ESPhome
#
# TODO : once oven (7) and dishwasher (8) are added in separately, modify existing measurements for correct and meaningful names, even at the expense of throwing away previous measurements
#
# NOTE : Horno (7) induces a significant amount on other circuits, namely :
#   Fuerza Húmedos (5), at around 80 W : no adjustment necessary (can be made later based upon status of Horno (7) to substract some Watts
#   Inducción (6), enough to get past the 0.75 A threshold below which we report zero : just raising the threshold a bit more
#
# NOTE : Horno (7) also induces current linearly onto dishwasher (8) and hence consumption for the latter must be compensated for (up to 30 W approximately)
# NOTE / TODO : tried using a 10 A CT for dishwasher but it seemed to be broken, so using a 5 A with different amplification, which may or may not give accurate results
#####
#
# Last Modified : 2022-03-25
#
globals:
  - id: basement_power
    type: float
    initial_value: '5.0'
  - id: entrance_lights_power
    type: float
    initial_value: '0.0'
  - id: east_lights_power
    type: float
    initial_value: '0.0'
  - id: west_lights_power
    type: float
    initial_value: '0.0'
  - id: mvhr_power_multiplier
    type: float
    initial_value: '1.0'

esphome:
  name: power-monitoring
  comment: "Home Power Monitoring"
  platform: ESP32
  board: nodemcu-32s

wifi:
  ssid: !secret home_ssid
  password: !secret home_ssid_password
  power_save_mode: none
  fast_connect: on
  use_address: 192.168.1.170
  manual_ip:
    static_ip: 192.168.1.170
    gateway: 192.168.1.1
    subnet: 255.255.255.0
    dns1: 192.168.1.100
    dns2: 192.168.1.10
  ap:
    ssid: "HOME_POWER_MONITORING"
    password: !secret esp_ap_password

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Madrid"

captive_portal:

logger:
  level: WARN

api:
  password: !secret esphome_api_password

ota:
  safe_mode: True
  password: !secret esphome_ota_password

web_server:
  port: 8888
  auth:
    username: !secret esphome_web_server_username
    password: !secret esphome_web_server_password


sun:
  latitude: 40.35°
  longitude: -4.05°

# Create single I2C bus where both ADS1115 at addresses 0x48 and 0x49 will be used and
# instantiate the two ADC boards (hubs) at their corresponding addresses
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 800kHz
  id: i2c_bus

ads1115:
  - address: 0x48
    continuous_mode: off
    id: ads1115_bus_0x48

  - address: 0x49
    continuous_mode: off
    id: ads1115_bus_0x49


# Board monitoring and power cycling
switch:
  - platform: restart
    name: "Home Power Monitoring Restart"

binary_sensor:
  - platform: status
    name: "Home Power Monitoring Status"

text_sensor:
  - platform: homeassistant
    entity_id: switch.sonoff_basic_01
    id: entrance_lights_status
    on_value:
      then:
        lambda: |-
          if (x == "on") {
            id(entrance_lights_power) = 12.0;
          }
          else {
            id(entrance_lights_power) = 0.0;
          }
  - platform: homeassistant
    entity_id: switch.attic_relay_east_3
    id: east_lights_status
    on_value:
      then:
        lambda: |-
          if (x == "on") {
            id(east_lights_power) = 30.0;
          }
          else {
            id(east_lights_power) = 0.0;
          }
  - platform: homeassistant
    entity_id: switch.attic_relay_west_3
    id: west_lights_status
    on_value:
      then:
        lambda: |-
          if (x == "on") {
            id(west_lights_power) = 20.0;
          }
          else {
            id(west_lights_power) = 0.0;
          }
  - platform: homeassistant
    entity_id: switch.control_remoto_on_off_comfoair
    id: mvhr_switch_status
    on_value:
      then:
        lambda: |-
          if (x == "on") {
            id(mvhr_power_multiplier) = 1.0;
          }
          else {
            id(mvhr_power_multiplier) = 0.0;
          }

sensor:
  - platform: wifi_signal
    name: "Home Power Monitoring WiFi Level"
    update_interval: 60s

  - platform: homeassistant
    name: "Measured AC Voltage"
    entity_id: sensor.ac_voltage
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    id: ha_ac_voltage
    filters:
      - offset: 12.0

#### Sensor definitions for each of the monitored circuits in separate files for readability

# 1. FRIDGE (ADS1115 0x48 , A0_GND)
# 5 A / 1 V SCT-013 #1
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 2.048
    name: "Fridge AC Current"
    ads1115_id: ads1115_bus_0x48
    update_interval: 24ms
    id: ac_a_fridge_ct_sensor
    state_class: measurement
    device_class: current
    unit_of_measurement: "A"
    icon: "mdi:flash"
    accuracy_decimals: 8
    filters:
      - lambda: return x * x;                 ####
      - sliding_window_moving_average:        #
          window_size: 1250                   # This blocks calculates the RMS voltage sampled by the ADS1115 ADC (averages over 30 s and reports every 15 s)
          send_every:  625                    #
      - lambda: return sqrt(x);               ####
      - multiply:  5.0                        # Mapping measured voltage from CT clamp to current in the primary circuit (for  5 A / 1 V CT clamp)
      - lambda: if (x < 0.03) return 0.0; else return x;

  - platform: template
    name: "Fridge AC Power"
    lambda: |-
      if ( id(ac_a_fridge_ct_sensor).state < 0 ) {
        return 0;
      }
      if ( id(ha_ac_voltage).state < 180 ) {
        return ( abs(230.0 * id(ac_a_fridge_ct_sensor).state) );
      }
      else {
        return ( abs(id(ha_ac_voltage).state * id(ac_a_fridge_ct_sensor).state) );
      }
    accuracy_decimals: 1
    update_interval: 30s
    state_class: measurement
    device_class: power
    unit_of_measurement: "W"
    id: ac_power_fridge
  
  - platform: total_daily_energy
    name: "Fridge Energy Consumed"
    power_id: ac_power_fridge
    unit_of_measurement: kWh
    filters:
      - multiply: 0.001
  

# 2. LIGHTING + WASHING MACHINE (ADS1115 0x48, A1_GND)
# 15 A / 1 V SCT-013 #1
